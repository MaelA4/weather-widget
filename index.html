<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widgets Test</title>
    <script type="module" src="weather-widget.js" defer></script>
    <script type="module" src="weather-history.js" defer></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 40px;
            background: #f4f4f9;
            margin: 0;
        }
        .section {
            margin-bottom: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            align-items: start;
        }
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
            align-items: start;
        }
    </style>
</head>
<body>

    <h1>Wetter Web Components</h1>

    <section class="section">
        <h2>Aktuelles Wetter (&lt;weather-widget&gt;)</h2>
        <div class="grid">
            <weather-widget city="Karlsruhe"></weather-widget>
            <weather-widget city="Tokio"></weather-widget>
            <weather-widget city="Berlin"></weather-widget>
        </div>
    </section>

    <section class="section">
        <h2>Historischer Verlauf (&lt;weather-history&gt;)</h2>
        <div class="history-grid">
            <weather-history city="Karlsruhe" days="7"></weather-history>
            <weather-history city="Tokio" days="14"></weather-history>
        </div>
    </section>

</body>
</html>
